<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <title>找不到頁面 | 懋洲冷氣工程 MZAC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@900&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-bg: #0D0F12; --ice-400: #4FC3F7; --ice-600: #29ABE2;
      --silver: #F5F7FA; --silver-dim: #8B95A3;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }
    body {
      font-family: 'Outfit', 'Noto Sans TC', sans-serif;
      background: var(--color-bg); color: var(--silver);
      min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 5vw; text-align: center; overflow: hidden;
    }
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
    }
    .glow {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 600px; height: 400px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(79,195,247,.07), transparent 65%);
      pointer-events: none;
    }
    .wrap { position: relative; z-index: 1; max-width: 480px; }
    .code {
      font-family: 'Outfit', sans-serif; font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 900; line-height: 1; letter-spacing: -.04em;
      background: linear-gradient(135deg, var(--ice-400), var(--ice-600));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Noto Serif TC', serif; font-size: clamp(1.3rem, 4vw, 1.8rem);
      font-weight: 900; margin-bottom: 12px; color: var(--silver);
    }
    p { font-size: 15px; color: var(--silver-dim); line-height: 1.75; margin-bottom: 40px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 28px; background: var(--ice-400); color: #fff;
      border-radius: 100px; font-size: 14px; font-weight: 700;
      text-decoration: none; letter-spacing: .04em;
      box-shadow: 0 0 0 1px rgba(79,195,247,.3), 0 6px 24px rgba(79,195,247,.2);
      transition: transform .3s var(--ease-out), box-shadow .3s, opacity .3s;
    }
    .btn-primary:hover { transform: translateY(-2px); opacity: .9; }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 28px; background: rgba(255,255,255,.06);
      color: rgba(226,232,240,.8); border: 1px solid rgba(255,255,255,.12);
      border-radius: 100px; font-size: 14px; font-weight: 600;
      text-decoration: none; letter-spacing: .04em;
      transition: transform .3s var(--ease-out), border-color .25s;
    }
    .btn-secondary:hover { transform: translateY(-2px); border-color: rgba(79,195,247,.3); }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="code">404</div>
    <h1>找不到這個頁面</h1>
    <p>您要找的頁面不存在或已移除。<br>請回首頁，或透過 LINE 與我們聯繫。</p>
    <div class="actions">
      <a href="index.html" class="btn-primary">← 回首頁</a>
      <a href="https://line.me/R/ti/p/@559tescn" target="_blank" class="btn-secondary">LINE 聯繫我們</a>
    </div>
  </div>
</body>
</html>
